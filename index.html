<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeskMate"><meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>DeskMate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overflow-x:hidden;max-width:100vw;background:#000;color:#cff;font-family:-apple-system,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#bubble{position:fixed;left:5%;right:5%;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;font-size:18px;min-height:1em;text-shadow:0 0 8px #0ff8}
#heard{position:fixed;left:5%;right:5%;top:calc(20px + env(safe-area-inset-top));text-align:center;font-size:14px;opacity:.6}
#bar{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:100vw;overflow:hidden;padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:flex;gap:4px;align-items:center}
#mic{width:72px;height:72px;border-radius:50%;border:none;background:#0ff;font-size:30px;flex:none}
#mic.on{background:#f55;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.08)}}
#txt{flex:1 1 0;min-width:0;width:0;padding:10px 12px;border-radius:20px;border:1px solid #0ff5;background:#111;color:#fff;font-size:16px}
.b{background:none;border:none;color:#0ff;font-size:24px}
#set{position:fixed;inset:0;background:#000e;display:none;padding:calc(30px + env(safe-area-inset-top)) 20px;overflow:auto}
#set label{display:block;margin:14px 0 4px;font-size:14px}
#set input,#set select{width:100%;padding:10px;font-size:16px;background:#111;color:#fff;border:1px solid #0ff5;border-radius:8px}
#set button{margin-top:18px;padding:12px 20px;font-size:16px;border-radius:10px;border:none;background:#0ff}
small{opacity:.6}

#log{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));height:55%;background:#050b0ef2;border-top:1px solid #0ff4;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;display:none;font-size:15px;line-height:1.5;user-select:text;-webkit-user-select:text}
#log.open{display:block}
.m{margin:8px 0;padding:8px 10px;border-radius:12px;max-width:92%;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{background:#033;margin-left:auto}.m.a{background:#111;color:#eff}
.m pre{background:#000;padding:8px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre}
.m h1,.m h2,.m h3,.m h4{font-size:16px;margin:8px 0 4px;color:#6ff}
.fc{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.fc button,.chip button{background:#0ff;border:none;border-radius:8px;padding:6px 10px;font-size:14px}
.m img{max-width:120px;max-height:120px;border-radius:8px;margin:2px}
#chips{position:fixed;left:8px;right:8px;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;z-index:5}
.chip{flex:none;background:#123;border:1px solid #0ff6;border-radius:10px;padding:4px;display:flex;align-items:center;gap:4px;font-size:12px;max-width:180px}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:6px}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{padding:2px 7px;background:#f55}
.b.on{background:#0ff3;border-radius:10px}
#mic{width:52px;height:52px;font-size:24px;flex:none}
.b{font-size:20px;padding:2px;flex:none;min-width:30px}
#prog{position:fixed;top:calc(64px + env(safe-area-inset-top));left:5%;right:5%;text-align:center;font-size:13px;color:#ff6}
#mode{position:fixed;top:calc(44px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:13px;color:#ff6;display:none}
</style></head><body>
<canvas id="c"></canvas><div id="heard"></div><div id="bubble">タップして話しかけてね</div>
<div id="mode">🔍 分析モード：プロンプトや画像を送ると詳しく分析するよ</div>
<div id="prog"></div><div id="log"></div><div id="chips"></div>
<input type="file" id="file" multiple accept="image/*,application/pdf,text/*,.txt,.md,.json,.csv,.html,.js,.ts,.py,.css,.xml,.yaml,.yml" hidden>
<div id="bar"><button class="b" id="gear">⚙️</button><button class="b" id="logb">💬</button><button class="b" id="att">📎</button><button class="b" id="ana">🔍</button><input id="txt" placeholder="メッセージ" enterkeyhint="send"><button class="b" id="send">➤</button><button id="mic">🎤</button></div>
<div id="set"><h2>設定</h2>
<label>Gemini APIキー（必須）</label><input id="kGem" type="password" autocomplete="off">
<label>Geminiモデル</label><input id="mGem" placeholder="gemini-3.8-flash">
<label>Groq APIキー（任意・予備）</label><input id="kGroq" type="password" autocomplete="off">
<label>Groqモデル</label><input id="mGroq" placeholder="llama-3.3-70b-versatile">
<label>OpenRouter APIキー（任意・予備）</label><input id="kOR" type="password" autocomplete="off">
<label>OpenRouterモデル</label><input id="mOR" placeholder="openrouter/free">
<label>声の速さ</label><input id="rate" type="number" step="0.1" min="0.5" max="2" placeholder="1.1">
<small>キーはこの端末のlocalStorageだけに保存されます。</small><br>
<button id="save">保存</button> <button id="clr" style="background:#555;color:#fff">会話履歴を消す</button> <button id="close" style="background:#333;color:#fff">閉じる</button></div>
<script>
const $=id=>document.getElementById(id),LS=localStorage;
const S=k=>LS.getItem('dm_'+k)||'',W=(k,v)=>LS.setItem('dm_'+k,v);
const F={kGem:'kGem',mGem:'mGem',kGroq:'kGroq',mGroq:'mGroq',kOR:'kOR',mOR:'mOR',rate:'rate'};
function openSet(){for(const k in F)$(k).value=S(k);$('set').style.display='block'}
$('gear').onclick=openSet;$('close').onclick=()=>$('set').style.display='none';
$('save').onclick=()=>{for(const k in F)W(k,$(k).value.trim());$('set').style.display='none';say('設定したよ！','happy')};
$('clr').onclick=()=>{LS.removeItem('dm_hist');alert('履歴を消しました')};
if(!S('kGem'))setTimeout(openSet,300);

/* ---------- face ---------- */
const cv=$('c'),cx=cv.getContext('2d');let Wd,Ht;
function rs(){const d=devicePixelRatio||1;Wd=innerWidth;Ht=innerHeight;cv.width=Wd*d;cv.height=Ht*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();
const face={expr:'neutral',lx:0,ly:0,tx:0,ty:0,blink:0,nextBlink:0,talk:0,until:0};
const E={ // eye open(0-1), lid tilt, mouth curve, color
neutral:{o:1,t:0,m:.3,c:'#4ff'},happy:{o:.55,t:0,m:1,c:'#4ff',arc:1},sad:{o:.75,t:-.35,m:-.6,c:'#6af'},
surprised:{o:1.25,t:0,m:0,c:'#4ff',O:1},thinking:{o:.8,t:.15,m:.05,c:'#9ef'},sleepy:{o:.15,t:0,m:.1,c:'#48a'},angry:{o:.8,t:.4,m:-.4,c:'#f64'}};
let cur={...E.neutral};
function setExpr(e,ms=6000){if(!E[e])e='neutral';face.expr=e;face.until=performance.now()+ms}
let lastAct=performance.now();
function draw(t){
 requestAnimationFrame(draw);
 if(face.expr!=='neutral'&&t>face.until&&!speaking&&!busy)face.expr='neutral';
 if(t-lastAct>60000&&!busy&&!speaking)face.expr='sleepy';
 const g=E[face.expr];for(const k of['o','t','m'])cur[k]+=(g[k]-cur[k])*.15;cur.c=g.c;
 if(t>face.nextBlink){face.blink=1;face.nextBlink=t+2000+Math.random()*4000}
 face.blink=Math.max(0,face.blink-.12);
 if(Math.random()<.01){face.tx=(Math.random()-.5)*2;face.ty=(Math.random()-.5)*1}
 if(face.expr==='thinking'){face.tx=.8;face.ty=-.8}
 face.lx+=(face.tx-face.lx)*.06;face.ly+=(face.ty-face.ly)*.06;
 cx.clearRect(0,0,Wd,Ht);
 const s=Math.min(Wd,Ht*.8)/400,cxm=Wd/2+face.lx*20*s,cym=Ht*.4+face.ly*15*s+Math.sin(t/900)*4*s;
 const bl=face.blink>0?Math.abs(Math.cos(face.blink*Math.PI)):1;
 cx.shadowColor=cur.c;cx.shadowBlur=25*s;cx.fillStyle=cur.c;cx.strokeStyle=cur.c;
 for(const side of[-1,1]){
  const ex=cxm+side*80*s,ew=70*s,eh=Math.max(6*s,95*s*cur.o*bl);
  cx.save();cx.translate(ex,cym);
  if(g.arc&&bl>.5){cx.lineWidth=16*s;cx.lineCap='round';cx.beginPath();cx.arc(0,15*s,ew/2,Math.PI*1.1,Math.PI*1.9);cx.stroke();}
  else if(g.O&&bl>.5){cx.beginPath();cx.ellipse(0,0,ew/2*1.05,eh/2,0,0,7);cx.fill();}
  else{rr(-ew/2,-eh/2,ew,eh,Math.min(ew,eh)/2.2);cx.fill();
   if(Math.abs(cur.t)>.05){cx.save();cx.shadowBlur=0;cx.fillStyle='#000';cx.beginPath();const ty=-eh/2-2*s,d=cur.t*60*s*side;
    cx.moveTo(-ew,ty-40*s);cx.lineTo(ew,ty-40*s);cx.lineTo(ew,ty+(-d>0?-d:0)+ (cur.t>0?(side>0?0:d*side):0));cx.lineTo(-ew,ty+(cur.t*side*-1>0?0:0)+(side<0?-d:0)*0+ (cur.t>0?(side<0?-d*side:0):0));cx.closePath();
    cx.restore();
    cx.save();cx.shadowBlur=0;cx.fillStyle='#000';cx.beginPath();const tilt=cur.t*side; // inner corner lower when angry
    cx.moveTo(-ew/2-5,-eh/2-5);cx.lineTo(ew/2+5,-eh/2-5);cx.lineTo(ew/2+5,-eh/2+ (tilt>0?0:-tilt*eh*.9) + (tilt>0?0:0));
    cx.lineTo(-ew/2-5,-eh/2+(tilt>0?tilt*eh*.9:0));cx.closePath();
    if(side<0){ /* mirror handled by tilt sign */ }cx.fill();cx.restore();}
  }
  cx.restore();
 }
 // mouth
 const my=cym+95*s,mw=50*s;cx.lineWidth=7*s;cx.lineCap='round';cx.beginPath();
 if(speaking){const a=6*s+Math.abs(Math.sin(t/90))*16*s;cx.ellipse(cxm,my,mw*.45,a,0,0,7);cx.fill()}
 else if(g.O){cx.ellipse(cxm,my,14*s,18*s,0,0,7);cx.stroke()}
 else{cx.moveTo(cxm-mw/2,my);cx.quadraticCurveTo(cxm,my+cur.m*35*s,cxm+mw/2,my);cx.stroke()}
 if(face.expr==='sleepy'){cx.shadowBlur=0;cx.font=`${30*s}px sans-serif`;cx.fillText('z',cxm+150*s,cym-60*s-((t/30)%40)*s)}
 if(face.expr==='angry'){cx.font=`${36*s}px sans-serif`;cx.fillText('💢',cxm+130*s,cym-100*s)}
 if(face.expr==='sad'){cx.beginPath();cx.ellipse(cxm-85*s,cym+60*s+((t/20)%40)*s,6*s,9*s,0,0,7);cx.fill()}
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
requestAnimationFrame(draw);
cv.onclick=()=>{lastAct=performance.now();setExpr(['happy','surprised'][Math.random()*2|0],1500)};

/* ---------- speech ---------- */
let speaking=false,busy=false,voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ja'));voice=v.find(x=>/Kyoko|O-ren|Hattori/.test(x.name))||v[0]||null}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function say(text,expr){$('bubble').textContent=text;setExpr(expr||'neutral',4000+text.length*150);
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}]/gu,''));u.lang='ja-JP';if(voice)u.voice=voice;u.rate=parseFloat(S('rate'))||1.1;u.pitch=1.4;
 u.onstart=()=>speaking=true;u.onend=u.onerror=()=>{speaking=false;setExpr(face.expr,2500)};speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
$('mic').onclick=()=>{
 // unlock TTS on iOS within user gesture
 speechSynthesis.speak(new SpeechSynthesisUtterance(''));lastAct=performance.now();
 if(!SR){$('bubble').textContent='この環境は音声認識非対応だよ。文字で話してね';return}
 if(listening){rec&&rec.stop();return}
 rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;let final='';
 rec.onstart=()=>{listening=true;$('mic').classList.add('on');setExpr('surprised',800);$('heard').textContent='聞いてるよ…'};
 rec.onresult=e=>{let s='';for(const r of e.results){s+=r[0].transcript;if(r.isFinal)final=s}$('heard').textContent=s};
 rec.onerror=e=>{$('heard').textContent=e.error==='not-allowed'?'マイクが許可されていないよ（HTTPSで開いてね）':'聞き取れなかった…'};
 rec.onend=()=>{listening=false;$('mic').classList.remove('on');const q=final||$('heard').textContent;if(final)ask(final)};
 rec.start()};
function sendTxt(){const q=$('txt').value.trim();if(!q&&!atts.length)return;speechSynthesis.speak(new SpeechSynthesisUtterance(''));$('txt').value='';$('heard').textContent=q;ask(q);$('txt').blur()}
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendTxt()}});$('send').onclick=sendTxt;
/* ---------- attachments ---------- */
let atts=[];const TXT=/^(text\/|application\/(json|xml|javascript|x-yaml))|\.(txt|md|json|csv|html?|js|ts|py|css|xml|ya?ml)$/i;
$('att').onclick=()=>$('file').click();
$('file').onchange=async e=>{for(const f of e.target.files)await addFile(f);e.target.value=''};
const BIG=5000;function bigText(t,n){atts.push({kind:'txt',name:n||`貼り付け${atts.length+1}.txt`,text:t,mime:'text/plain'});chips()}
$('txt').addEventListener('input',()=>{const v=$('txt').value;if(v.length>BIG){$('txt').value='';bigText(v)}});
document.addEventListener('paste',async e=>{const pt=e.clipboardData?.getData('text/plain');if(pt&&pt.length>BIG){e.preventDefault();bigText(pt);return}const it=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file');if(!it.length)return;e.preventDefault();for(const i of it){const f=i.getAsFile();if(f)await addFile(f)}});
const rdURL=f=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsDataURL(f)});
async function shrink(f){const url=URL.createObjectURL(f);try{const im=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});
 const k=Math.min(1,1536/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k|0;c.height=im.height*k|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}finally{URL.revokeObjectURL(url)}}
async function addFile(f){try{const name=f.name||('image.'+(f.type.split('/')[1]||'png'));let a;
 if(f.type.startsWith('image/')){let d;try{d=await shrink(f)}catch{d=await rdURL(f)}a={kind:'img',name,mime:d.slice(5,d.indexOf(';')),data:d.split(',')[1],thumb:d}}
 else if(f.type==='application/pdf'||/\.pdf$/i.test(name)){if(f.size>2e9){alert('2GBまでです');return}a={kind:'pdf',name,mime:'application/pdf',blob:f,size:f.size}}
 else if(TXT.test(f.type)||TXT.test(name)){if(f.size>200e6){alert('200MBまでです');return}a={kind:'txt',name,text:await f.text(),mime:'text/plain'}}
 else{alert('この形式は未対応です: '+name);return}
 atts.push(a);chips()}catch(e){alert('読み込み失敗: '+e.message)}}
const fmtN=n=>n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+'万':String(n);
function chips(){$('chips').innerHTML='';atts.forEach((a,i)=>{const d=document.createElement('div');d.className='chip';
 d.innerHTML=(a.thumb?`<img src="${a.thumb}">`:`<b>${a.kind==='pdf'?'📄':'📝'}</b>`)+`<span>${esc(a.name)}${a.text?` (${fmtN(a.text.length)}字)`:a.size?` (${(a.size/1e6).toFixed(1)}MB)`:''}</span><button>×</button>`;
 d.querySelector('button').onclick=()=>{atts.splice(i,1);chips()};$('chips').appendChild(d)})}

/* ---------- chat log ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('logb').onclick=()=>{const o=$('log').classList.toggle('open');$('logb').classList.toggle('on',o);if(o)$('log').scrollTop=1e9};
let anaMode=false;$('ana').onclick=()=>{anaMode=!anaMode;$('ana').classList.toggle('on',anaMode);$('mode').style.display=anaMode?'block':'none'};
const FENCE=/```([\w+#.-]*)[ \t]*(?:[:：]|filename=)?[ \t]*([^\n`]*)\n([\s\S]*?)```/g;
const EXT={js:'javascript',py:'python',md:'markdown',txt:'text',json:'json',csv:'csv',html:'html',css:'css',ts:'typescript',xml:'xml',yaml:'yaml',sh:'bash'};
const MIME={txt:'text/plain',md:'text/markdown',json:'application/json',csv:'text/csv',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',py:'text/x-python',xml:'application/xml',svg:'image/svg+xml'};
function md(s){return esc(s).replace(/^#{1,4} (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^[-*] /gm,'• ').replace(/\n/g,'<br>')}
function render(t){const box=document.createElement('div');let last=0,m,n=0;FENCE.lastIndex=0;
 while((m=FENCE.exec(t))){box.insertAdjacentHTML('beforeend',md(t.slice(last,m.index)));last=FENCE.lastIndex;n++;
  let lang=m[1]||'',fn=m[2].trim();if(!/\.\w+$/.test(fn)){if(/\.\w+$/.test(lang)){fn=lang;lang=lang.split('.').pop()}else fn=''}
  const code=m[3];if(!fn){const ext=Object.keys(EXT).find(k=>EXT[k]===lang.toLowerCase()||k===lang.toLowerCase())||'txt';fn=`file${n}.${ext}`}
  const c=document.createElement('div');c.innerHTML=`<div class="fc">📄 <b>${esc(fn)}</b><button>保存/共有</button><button>コピー</button></div><pre>${esc(code)}</pre>`;
  const [sv,cp]=c.querySelectorAll('button');sv.onclick=()=>saveFile(fn,code);cp.onclick=()=>navigator.clipboard?.writeText(code).then(()=>cp.textContent='✓');box.appendChild(c)}
 box.insertAdjacentHTML('beforeend',md(t.slice(last)));return box}
async function saveFile(fn,text){const ext=fn.split('.').pop().toLowerCase(),type=(MIME[ext]||'text/plain')+';charset=utf-8';
 const blob=new Blob([ext==='csv'?'\ufeff'+text:text],{type});const file=new File([blob],fn,{type:MIME[ext]||'text/plain'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}}catch(e){if(e.name==='AbortError')return}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)}
function logMsg(r,t,files=[]){const d=document.createElement('div');d.className='m '+r;
 if(r==='u'){d.innerHTML=esc(t).replace(/\n/g,'<br>');files.forEach(a=>d.insertAdjacentHTML('beforeend',a.thumb?`<br><img src="${a.thumb}">`:`<br>${a.kind==='pdf'?'📄':'📝'} ${esc(a.name)}`))}
 else d.appendChild(render(t));$('log').appendChild(d);$('log').scrollTop=1e9}

/* ---------- AI ---------- */
const SYS=`あなたは「ルーナ」という、スマホの中に住む小さくてかわいいロボットのペットです。日本語で、友達のようにやさしく元気に話します。
返事の先頭に必ず今の気持ちを [happy] [sad] [surprised] [thinking] [sleepy] [angry] [neutral] のどれか1つのタグで付けてください。例: [happy]わーい、会えてうれしいな！
普段の会話は1〜2文の短い話し言葉にし、マークダウンや絵文字は使わないでください（読み上げられます）。
説明・分析・文章作成など長い内容が必要なときは、タグの直後の最初の1文を読み上げ用の短い要約にし、改行してから詳しい内容を書いてください（マークダウン可）。
ユーザーがファイルの作成を頼んだら、ファイルごとに \`\`\`言語 ファイル名.拡張子 の形式のコードブロックで中身を出力してください（例: \`\`\`csv data.csv）。添付された画像・PDF・テキストも読んで答えてください。`;
const ANA=`
【分析モード】ユーザーが送ったプロンプトや画像を詳しく分析してください。画像生成プロンプト（NovelAI / Stable Diffusion のタグ形式など）の場合、または画像の場合は、次の見出しで日本語で整理してください：
## 被写体 / ## 服装 / ## ポーズ・表情 / ## 構図・カメラ / ## 背景・ライティング / ## 画風・スタイル / ## 品質タグ / ## 問題点（矛盾・重複・弱いタグ・ネガティブに入れるべきもの） / ## 改善版プロンプト（\`\`\`text prompt.txt のコードブロックで、必要ならネガティブも negative.txt で）
画像の場合は、その画像を再現するためのタグ形式プロンプトも改善版として出してください。普通の文章プロンプトの場合は、目的・構造・曖昧な点・改善版を整理してください。`;
const hist=()=>{try{return JSON.parse(S('hist'))||[]}catch{return[]}};
const GB='https://generativelanguage.googleapis.com';
const estTok=s=>{let n=0;for(let i=0;i<s.length;i+=1){n+=s.charCodeAt(i)>255?1:.28}return n|0};
const tb=s=>new Blob([s]).size;
const prog=t=>$('prog').textContent=t||'';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function upload(blob,mime,name){const k=S('kGem');prog(`📤 ${name} をアップロード中…`);
 const s=await fetch(`${GB}/upload/v1beta/files`,{method:'POST',headers:{'x-goog-api-key':k,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(blob.size),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:name.replace(/[^\w.-]/g,'_')}})});
 if(!s.ok)throw new Error('upload start '+s.status);const url=s.headers.get('x-goog-upload-url');if(!url)throw new Error('upload url hidden (CORS)');
 const u=await fetch(url,{method:'POST',headers:{'X-Goog-Upload-Command':'upload, finalize','X-Goog-Upload-Offset':'0'},body:blob});
 if(!u.ok)throw new Error('upload '+u.status);let f=(await u.json()).file;
 for(let i=0;f.state==='PROCESSING'&&i<60;i++){await sleep(2000);f=await (await fetch(`${GB}/v1beta/${f.name}`,{headers:{'x-goog-api-key':k}})).json()}
 if(f.state==='FAILED')throw new Error('file processing failed');prog('');return {file_data:{mime_type:mime,file_uri:f.uri}}}
const b64=blob=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ng;r.readAsDataURL(blob)});
// build Gemini parts for an attachment; large → File API
async function gPart(a){
 if(a.kind==='img')return {inline_data:{mime_type:a.mime,data:a.data}};
 if(a.kind==='pdf'){if(a.size>4e6){a.part=a.part||await upload(a.blob,a.mime,a.name);return a.part}return {inline_data:{mime_type:a.mime,data:await b64(a.blob)}}}
 const bytes=tb(a.text);if(bytes<=2e5)return {text:`[添付ファイル: ${a.name}]\n${a.text}`};
 if(bytes>4e6){a.part=a.part||await upload(new Blob([a.text],{type:'text/plain'}),'text/plain',a.name);return [{text:`[添付ファイル: ${a.name}]`},a.part]}
 return [{text:`[添付ファイル: ${a.name}]`},{inline_data:{mime_type:'text/plain',data:await b64(new Blob([a.text],{type:'text/plain'}))}}]}
function partsFor(x,multi){let t=x.t||'';for(const a of x.a||[]){if(a.kind==='txt')t+=`\n\n[添付ファイル: ${a.name}]\n${a.text.slice(0,30000)}${a.text.length>30000?'\n…(長いため省略。このモデルでは全文は扱えません)':''}`;else t+=`\n\n[${a.kind==='img'?'画像':'PDF'}「${a.name}」が添付されていますが、このモデルでは中身を見られません。そのことを伝えてください]`}
 return [{text:t.trim()||'(添付のみ)'}]}
async function gContents(h){const out=[];for(const x of h){const p=[{text:x.t||(x.a?.length?'これを見て':'…')}];
 if(x.r==='u'&&x.a)for(const a of x.a){const r=await gPart(a);Array.isArray(r)?p.push(...r):p.push(r)}out.push({role:x.r==='u'?'user':'model',parts:p})}return out}
async function gCall(contents,sys,maxTok=8192){const k=S('kGem');if(!k)throw{skip:1};const models=[...new Set([S('mGem')||'gemini-3.8-flash','gemini-3.5-flash-lite','gemini-flash-latest'])];let err;
 for(const m of models)for(let tr=0;tr<3;tr++){try{
  const r=await fetch(`${GB}/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},
   body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents,generationConfig:{maxOutputTokens:maxTok,temperature:.9}})});
  if(!r.ok){const body=await r.text();const e=new Error('Gemini '+m+' '+r.status+' '+body.slice(0,300));e.status=r.status;e.tooBig=r.status===400&&/token|too large|exceeds|size/i.test(body);
   if(r.status===429){const d=+(body.match(/"retryDelay":\s*"(\d+)/)||[])[1];if(d&&d<=70&&tr<2){prog(`⏳ 制限中… ${d}秒待って再試行`);await sleep(d*1000+500);continue}}throw e}
  const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');if(!t)throw new Error('empty '+(j.candidates?.[0]?.finishReason||''));return t}
  catch(e){err=e;if(e.tooBig)throw e;break}}throw err}
const LIMIT=600000,CH=150000;
async function gemini(h,sys){
 const last=h[h.length-1],big=(last.a||[]).filter(a=>a.kind==='txt'),tot=big.reduce((s,a)=>s+estTok(a.text),0);
 if(tot>LIMIT)return chunked(h,sys,last,big);
 try{return await gCall(await gContents(h),sys)}catch(e){if((e.tooBig||e.status===429)&&tot>CH)return chunked(h,sys,last,big);throw e}}
async function chunked(h,sys,last,big){
 const pieces=[];for(const a of big){let i=0,n=0;const t=a.text;while(i<t.length){let j=i,tok=0;const step=20000;while(j<t.length&&tok<CH){const s=t.slice(j,j+step);tok+=estTok(s);j+=step}j=Math.min(j,t.length);
   if(j<t.length){const nl=t.lastIndexOf('\n',j);if(nl>i+step)j=nl+1}pieces.push({name:a.name,idx:++n,text:t.slice(i,j)});i=j}}
 const q=last.t||'内容を要約して';const notes=[];
 for(let k=0;k<pieces.length;k++){const p=pieces[k];prog(`📚 大きいファイルを分割処理中… ${k+1}/${pieces.length}`);setExpr('thinking',120000);
  const r=await gCall([{role:'user',parts:[{text:`次はファイル「${p.name}」の第${p.idx}部分です（全${pieces.length}部分中${k+1}番目）。ユーザーの依頼「${q}」に答えるために必要な情報・要点・重要な引用を、日本語で箇条書きに抽出してください。前置きやタグは不要です。\n\n${p.text}`}]}],'あなたは長い文書を分割して読む正確なアシスタントです。',4096);
  notes.push(`### 第${k+1}部分（${p.name}）\n${r}`)}
 prog('🧩 まとめています…');
 const other=(last.a||[]).filter(a=>a.kind!=='txt');const lp=[{text:`${q}\n\n（以下は大きな添付ファイルを${pieces.length}分割して読んだメモです。これを統合して答えてください）\n\n${notes.join('\n\n')}`}];
 for(const a of other){const r=await gPart(a);Array.isArray(r)?lp.push(...r):lp.push(r)}
 const prev=await gContents(h.slice(0,-1));const out=await gCall([...prev,{role:'user',parts:lp}],sys);prog('');return out}
async function openai(url,k,model,h,sys,extra={}){if(!k)throw{skip:1};
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k,...extra},
  body:JSON.stringify({model,max_tokens:4096,temperature:.9,messages:[{role:'system',content:sys},...h.map(x=>({role:x.r==='u'?'user':'assistant',content:partsFor(x,false)[0].text}))]})});
 if(!r.ok)throw new Error(url+' '+r.status);const j=await r.json();return j.choices[0].message.content}
const providers=[(h,s)=>gemini(h,s).finally(()=>prog('')),
 (h,s)=>openai('https://api.groq.com/openai/v1/chat/completions',S('kGroq'),S('mGroq')||'llama-3.3-70b-versatile',h,s),
 (h,s)=>openai('https://openrouter.ai/api/v1/chat/completions',S('kOR'),S('mOR')||'openrouter/free',h,s,{'HTTP-Referer':location.origin,'X-Title':'DeskMate'})];
async function ask(q){if(busy)return;busy=true;lastAct=performance.now();setExpr('thinking',120000);$('bubble').textContent='うーん…';
 const cur=atts;atts=[];chips();const ana=anaMode;
 logMsg('u',(ana?'🔍 ':'')+q,cur);
 const h=hist().map(x=>({r:x.r,t:x.t}));h.push({r:'u',t:q,a:cur});
 const sys=SYS+(ana?ANA:'');let out=null,errs=[];
 for(const p of providers){try{out=await p(h.slice(-12),sys);break}catch(e){if(!e.skip)errs.push(e.message)}}
 busy=false;
 if(!out){console.warn(errs);logMsg('a','⚠️ '+errs.join('\n'));say(S('kGem')?'ごめんね、今ちょっと頭が回らないみたい。少し待ってからまた話しかけてね':'設定でAPIキーを入れてね','sad');return}
 let m=out.trim().match(/^\s*\[(\w+)\]\s*/),ex='neutral';out=out.trim();if(m){ex=m[1].toLowerCase();out=out.slice(m[0].length)}
 out=out.replace(/^\[(happy|sad|surprised|thinking|sleepy|angry|neutral)\]/gim,'').trim();
 const note=cur.length?` [添付: ${cur.map(a=>a.name).join(', ')}]`:'';
 const hh=hist();hh.push({r:'u',t:(ana?'(分析モード) ':'')+q+note});hh.push({r:'a',t:`[${ex}]`+out.slice(0,3000)});W('hist',JSON.stringify(hh.slice(-20)));
 logMsg('a',out);
 const long=out.length>90||out.includes('```')||out.includes('\n');
 let speak=out.split('\n')[0].replace(/```[\s\S]*/,'').replace(/[*#_`>|]/g,'').trim();
 if(long){const s=speak.match(/^.*?[。！？!?]/);speak=(s?s[0]:speak.slice(0,60));if(!speak)speak='できたよ！';speak+=' 詳しくはチャットを見てね';
  if(!$('log').classList.contains('open'))$('logb').click()}
 say(speak,ex)}
</script></body></html>
